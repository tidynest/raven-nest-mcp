<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source for docs/assets/social-preview.png. Render with:
       rsvg-convert -w 1280 -h 640 docs/assets/social-preview.svg -o docs/assets/social-preview.png
       Fonts: Adwaita Sans and JetBrainsMono Nerd Font. -->
  <defs>
    <style>
      .sans { font-family: 'Adwaita Sans', 'Inter', 'Helvetica', 'Arial', sans-serif; }
      .mono { font-family: 'JetBrainsMono Nerd Font', 'JetBrains Mono', 'Hack', monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0c0e14"/>
  <rect x="0" y="0" width="1280" height="6" fill="#7c6cff"/>

  <text x="80" y="112" class="mono" font-size="20" fill="#8a90a6" letter-spacing="2">MCP SERVER  /  RUST  /  APACHE-2.0</text>

  <text x="78" y="212" class="sans" font-size="92" font-weight="800" fill="#f2f3f7" letter-spacing="-2">Raven Nest MCP</text>

  <text x="80" y="276" class="sans" font-size="36" font-weight="500" fill="#c3c7d6">Pentesting tools for AI agents,</text>
  <text x="80" y="322" class="sans" font-size="36" font-weight="500" fill="#c3c7d6">without handing over a shell.</text>

  <!-- what the model sends -->
  <text x="80" y="398" class="mono" font-size="17" fill="#8a90a6" letter-spacing="1.5">THE MODEL SENDS</text>
  <rect x="80" y="414" width="470" height="132" rx="10" fill="#141722" stroke="#262b3b" stroke-width="1.5"/>
  <text x="104" y="454" class="mono" font-size="23" fill="#a99dff" font-weight="700">run_nmap</text>
  <text xml:space="preserve" x="104" y="490" class="mono" font-size="23" fill="#8a90a6">target     <tspan fill="#e4e6ee">"10.20.0.5"</tspan></text>
  <text xml:space="preserve" x="104" y="524" class="mono" font-size="23" fill="#8a90a6">scan_type  <tspan fill="#e4e6ee">"service"</tspan></text>

  <!-- arrow -->
  <path d="M574 480 H632" stroke="#7c6cff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M622 469 L634 480 L622 491" stroke="#7c6cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- what the server runs -->
  <text x="660" y="398" class="mono" font-size="17" fill="#8a90a6" letter-spacing="1.5">THE SERVER RUNS</text>
  <rect x="660" y="414" width="540" height="132" rx="10" fill="#141722" stroke="#262b3b" stroke-width="1.5"/>
  <text xml:space="preserve" x="684" y="462" class="mono" font-size="25" fill="#e4e6ee"><tspan fill="#8a90a6">$ </tspan>nmap -sV -oX - 10.20.0.5</text>
  <text x="684" y="510" class="mono" font-size="18" fill="#8a90a6">allowlist and scope checked, no shell,</text>
  <text x="684" y="534" class="mono" font-size="18" fill="#8a90a6">run written to the audit log</text>

  <text xml:space="preserve" x="80" y="598" class="mono" font-size="19" fill="#8a90a6">nmap   nuclei   sqlmap   Metasploit   and 19 more</text>
  <text x="1200" y="598" class="mono" font-size="19" fill="#8a90a6" text-anchor="end">github.com/tidynest/raven-nest-mcp</text>
</svg>
