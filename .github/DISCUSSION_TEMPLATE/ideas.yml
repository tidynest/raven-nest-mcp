body:
  - type: markdown
    attributes:
      value: |
        For a new tool wrapper, use the Tool proposals category. This form is for everything else.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: Describe the situation before the solution. What were you doing, and where did the server get in the way or fall short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Does this change what a model is allowed to do?
      description: If the idea adds a preset, raises a limit or loosens a default, say what stops it from being misused. Write "no" if it does not apply.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you get by today?
